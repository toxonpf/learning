<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР-25 - JavaScript в браузере</title>
    <style>
        body {
            background: #333;
            color: #fff;
            font-family: sans-serif;
        }
    </style>
</head>

<body>

    <!-- Задание 1: Способ 1 — inline через атрибут onclick -->
    <button onclick="alert('Задание 1: inline JS работает!')">Кнопка (inline)</button>

    <!-- Задание 3-4: div#container с текстом, p и комментарием -->
    <div id="container">
        Привет
        <p>Абзац <span>текста</span></p>
        <!-- комментарий -->
    </div>

    <!-- Задание 1: Способ 2 — встроенный script внизу body -->
    <script>
        console.log("Задание 1: встроенный <script> выполнен");
    </script>

    <!-- Задание 1: Способ 3 — внешний файл -->
    <script src="lesson25.js"></script>

</body>

</html>
