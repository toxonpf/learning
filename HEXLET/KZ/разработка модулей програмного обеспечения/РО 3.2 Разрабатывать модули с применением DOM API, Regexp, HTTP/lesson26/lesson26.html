<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР-26 - DOM структура и навигация</title>
    <style>
        body {
            background: #333;
            color: #fff;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <!-- Задание 1: h1, p, ul/li -->
    <h1>Заголовок</h1>
    <p>Абзац</p>
    <ul>
        <li>Первый</li>
        <li>Второй</li>
        <li>Третий</li>
    </ul>

    <!-- Задание 2: ul с 3 li -->
    <ul id="list2">
        <li>Пункт 1</li>
        <li>Пункт 2</li>
        <li>Пункт 3</li>
    </ul>

    <!-- Задание 3: три абзаца подряд -->
    <p class="para">Первый абзац</p>
    <p class="para">Второй абзац</p>
    <p class="para">Третий абзац</p>

    <!-- Задание 4: div > p -->
    <div id="task4">
        <p>Текст</p>
    </div>

    <!-- Задание 5: ul с 3 li для подсветки -->
    <ul id="list5">
        <li>Элемент 1</li>
        <li>Элемент 2</li>
        <li>Элемент 3</li>
    </ul>

    <!-- Задание 6: h1 и p для DevTools -->
    <h1 id="task6-h1">Заголовок для DevTools</h1>
    <p id="task6-p">Абзац для DevTools</p>

    <script src="lesson26.js"></script>
</body>
</html>
