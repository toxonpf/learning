name: Internet Shop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/nodejs/RO4_5/lesson6
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop_test
      JWT_SECRET: ci-only-test-secret-at-least-thirty-two-bytes
      CORS_ORIGIN: http://localhost:5500
      LOG_LEVEL: info
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d shop_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/nodejs/package-lock.json
      - name: Install dependencies
        working-directory: web/nodejs
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test
