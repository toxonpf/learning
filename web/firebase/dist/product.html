<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Товар — SHOP.</title>
  <meta name="description" content="Детальная страница товара." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    .product-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 32px 0 48px; align-items: start; }
    .product-img-wrap { border-radius: var(--radius-xl); overflow: hidden; aspect-ratio: 1; background: var(--bg-elevated); border: 1px solid var(--border); }
    .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { display: flex; flex-direction: column; gap: 20px; }
    .product-price-large { font-family: 'Space Grotesk', sans-serif; font-size: 2.2rem; font-weight: 700; }
    .stock-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; }
    .stock-dot { width: 8px; height: 8px; border-radius: 50%; }
    .stock-dot.in { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .stock-dot.out { background: #ef4444; }
    .qty-control { display: flex; align-items: center; gap: 12px; }
    .qty-btn { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
    .qty-btn:hover { border-color: var(--border-hover); background: var(--bg-glass-hover); }
    .qty-val { font-size: 1.1rem; font-weight: 700; min-width: 24px; text-align: center; }
    .reviews-section { padding: 40px 0; border-top: 1px solid var(--border); }
    .review-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
    .review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .review-meta { flex: 1; }
    .review-author { font-weight: 600; font-size: 0.9rem; }
    .review-date { font-size: 0.75rem; color: var(--text-muted); }
    .review-text { font-size: 0.875rem; line-height: 1.7; color: var(--text-secondary); }
    .reviews-list { display: flex; flex-direction: column; gap: 16px; }
    .related-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .product-hero { grid-template-columns: 1fr; } .related-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .related-grid { grid-template-columns: 1fr 1fr; } }
  </style>
  <script type="module" crossorigin src="./assets/product-BEPaKUpf.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/firebase-D4IcALkh.js">
  <link rel="modulepreload" crossorigin href="./assets/navbar-6rDgd_GQ.js">
  <link rel="modulepreload" crossorigin href="./assets/preload-helper-DNg48SyG.js">
  <link rel="modulepreload" crossorigin href="./assets/cart-w4DGmxVJ.js">
  <link rel="stylesheet" crossorigin href="./assets/firebase-Baxkqz5J.css">
</head>
<body>

<div id="page-loader" class="page-loader"><div class="spinner"></div></div>

<main class="page-main">
  <div class="container">

    <!-- Breadcrumb -->
    <nav style="font-size:0.85rem;color:var(--text-muted);display:flex;align-items:center;gap:8px;padding:8px 0;">
      <a href="./index.html" style="color:var(--text-secondary);">Каталог</a>
      <span>›</span>
      <span id="breadcrumb-name">Загрузка...</span>
    </nav>

    <!-- Product hero -->
    <div class="product-hero" id="product-hero">
      <div class="product-img-wrap"><img id="product-img" src="" alt="" /></div>
      <div class="product-info">
        <div>
          <span class="badge badge-accent" id="product-category"></span>
          <h1 class="section-title mt-8" id="product-name" style="font-size:1.8rem;"></h1>
        </div>
        <div class="d-flex align-center gap-8">
          <span class="stars" id="product-stars"></span>
          <span class="stars-count" id="product-stats"></span>
        </div>
        <p style="color:var(--text-secondary);line-height:1.8;font-size:0.95rem;" id="product-desc"></p>
        <div class="d-flex align-center gap-8">
          <div class="stock-tag" id="stock-tag">
            <span class="stock-dot" id="stock-dot"></span>
            <span id="stock-text"></span>
          </div>
        </div>
        <div class="product-price-large" id="product-price"></div>
        <div class="qty-control">
          <button class="qty-btn" id="qty-minus">−</button>
          <span class="qty-val" id="qty-val">1</span>
          <button class="qty-btn" id="qty-plus">+</button>
        </div>
        <button class="btn btn-primary btn-lg" id="add-to-cart-btn" style="width:100%">
          🛒 Добавить в корзину
        </button>
      </div>
    </div>

    <!-- Reviews -->
    <section class="reviews-section">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px;">
        <div>
          <h2 class="section-title">Отзывы</h2>
          <p class="section-subtitle" id="reviews-count-label">Загрузка...</p>
        </div>
        <button class="btn btn-secondary" id="open-review-btn">✏️ Написать отзыв</button>
      </div>

      <!-- Review form (hidden) -->
      <div id="review-form-wrap" style="display:none;margin-bottom:24px;" class="card" style="padding:24px;">
        <div style="padding:24px">
          <h3 style="margin-bottom:16px;font-size:1rem;">Ваш отзыв</h3>
          <div class="form-group mb-16">
            <label class="form-label">Оценка</label>
            <div class="star-rating" id="star-rating-input">
              <input type="radio" name="rating" id="s5" value="5" /><label for="s5">★</label>
              <input type="radio" name="rating" id="s4" value="4" /><label for="s4">★</label>
              <input type="radio" name="rating" id="s3" value="3" checked /><label for="s3">★</label>
              <input type="radio" name="rating" id="s2" value="2" /><label for="s2">★</label>
              <input type="radio" name="rating" id="s1" value="1" /><label for="s1">★</label>
            </div>
          </div>
          <div class="form-group mb-16">
            <label class="form-label" for="review-text-input">Текст отзыва</label>
            <textarea class="form-input" id="review-text-input" placeholder="Поделитесь впечатлениями о товаре..." rows="4"></textarea>
          </div>
          <div style="display:flex;gap:12px;">
            <button class="btn btn-primary" id="submit-review-btn">Отправить</button>
            <button class="btn btn-ghost" id="cancel-review-btn">Отмена</button>
          </div>
        </div>
      </div>

      <div class="reviews-list" id="reviews-list">
        <div class="loader"><div class="spinner"></div></div>
      </div>
      <div class="load-more-wrapper">
        <button class="btn btn-secondary" id="reviews-load-more" style="display:none">Показать ещё отзывы</button>
      </div>
    </section>

    <!-- Related -->
    <section style="padding:40px 0;border-top:1px solid var(--border);">
      <h2 class="section-title mb-24">Похожие товары</h2>
      <div class="related-grid" id="related-grid">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </section>

  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span>© 2024 SHOP.</span>
  </div>
</footer>

</body>
</html>
