<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <h1>Список моих любимых музыкальных групп:</h1>
        <script>
            var musicGroups = ['Queen', 'span', 'AC DC', 'glass animals', 'plamenev', 'remstein'];
            var arrayLength = musicGroups.length;
            
            document.body.innerHTML += "<ol id='list'>";
            for(var i = 1; i <= arrayLength; i++){
                document.getElementById("list").innerHTML += "<li>" + musicGroups.pop() + "</li>";
            }
        </script>
    </body>
</html>
