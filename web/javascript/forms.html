<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="styles/forms.css">
    </head>
    <body>
        <form name="regForm" class="login-form">
            <h2>Форма входа</h2>
            <div class="form-group">
                <label for="userLogin">Логин</label>
                <input type="text" id="userLogin" name="userLogin" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label for="userPassword">Пароль</label>
                <input type="text" id="userPassword" name="userPassword" placeholder="Введите пароль" required>
            </div>
            <a class="submit-btn" href="javascript:csvSend()"><center>Отправить форму</center></a>
        </form>
        <script>
            function csvSend(){
                const userLoginElement = document.forms.regForm.elements['userLogin'];
                let userLogin = userLoginElement.value;
                let regExpLogin = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?` ]/;
                let testLogin = false;

                const userLoginPassword = document.forms.regForm.elements['userPassword'];
                let userPassword = userLoginPassword.value;
                let regExpPassword = /([!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?` ])|([A-Z])/;
                let testPassword = false;

                if(!regExpLogin.test(userLogin) && userLogin.length >= 4) testLogin = true;
                if(regExpPassword.test(userPassword) && userPassword.length >= 8) testPassword = true;

                if(testPassword && testLogin){
                    alert("all right");
                }else{
                    alert("error of reg.");
                }
            }
        </script>
    </body>
</html>
