<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>document</title>
    <style>
        body {
            background-color: #333;
            font-family: Arial, sans-serif;
            color: #fff;
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-style: 11px;
        }


        #canv {
            background-color: #444;
        }


        #dateBlock {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px;
            font-size: 20px;
        }


        #date {
            margin-top: 30px;
        }


        #time {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <canvas id="canv">Обновите браузер</canvas>
    <input type="color" id="colorFill" />
    <input value="5" type="number" id="bolthElem" />
    <script>
        const canvas = document.querySelector('#canv');
        canvas.width = 1000;
        canvas.height = 700;
        const ctx = canvas.getContext('2d');

        const colorFill = document.querySelector('#colorFill');
        const bolthElem = document.querySelector('#bolthElem');
        var bolth = bolthElem.value;


        window.addEventListener('change', function () {
            ctx.fillStyle = colorFill.value;
            bolth = bolthElem.value;
        });


        canvas.addEventListener('mousemove', (event) => {
            if (event.buttons > 0) {
                ctx.fillRect(event.offsetX - (bolth / 2), event.offsetY - (bolth / 2), bolth, bolth);
            }
        });
    </script>
