<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body style="background-color: #333;">
        <script>
            function createFunction() {
                let callCount = 0;

                return function(showStats) {
                    callCount++;
                    
                    if(showStats){
                        console.log('Количество вызовов функции: ' + callCount);
                    }
                };
            }

            var myFunction = createFunction();

            myFunction();
            myFunction();
            myFunction(true);
        </script>
    </body>
</html>
