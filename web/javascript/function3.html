<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            function f1(x2){
                return x2 * 2;
            }

            var variable = f1;

            function f2(func, x3){
                return func(x3) * 3;
            }

            console.log(variable(3));
            console.log(f1(6));
            console.log(f2(variable, 4));
        </script>
    </body>
</html>
